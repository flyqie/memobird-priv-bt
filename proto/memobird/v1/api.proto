syntax = "proto3";

package memobird.v1;

option go_package = "github.com/flyqie/memobird-priv/gen/memobird/v1;v1";

message ErrDetail {
  // 错误信息
  string message = 1;
}

message GenericRequest {
  // 咕咕鸡设备GUID
  string smartGuid = 1;
}

message GenericResponse {
  // 目前空响应
}

message ListOnlineDevicesRequest {
  // 目前空请求
}

message ListOnlineDevicesResponse {
  // 当前咕咕鸡设备GUID列表
  repeated string onlineDevices = 1;
}

message DeviceDetailResponse {
  // 咕咕鸡设备GUID
  string smartGuid = 1;
  // MAC地址
  string bssid = 2;
  // LED
  bool led = 3;
  // 蜂鸣器
  bool buz = 4;
  // 打印浓度
  enum SpeedType {
    // 适中
    SPEED_DEFAULT = 0;
    // 浅
    SPEED_LIGHT = 1;
    // 深
    SPEED_DARK = 2;
    // 设备初始化的默认浓度
    SPEED_INIT = 3;
  }
  SpeedType speed = 5;
  // 固件版本
  string ver = 6;
  // 语言ID
  int32 languageId = 7;
  // 设备忙碌状态
  int32 busy = 8;
  // 旅程长度信息
  int64 trip = 9;
  // 设备加入时间
  int64 joinTime = 10;
  // 已发送消息数量
  uint64 msgCount = 11;
  // 队列消息数量
  uint64 msgQueueCount = 12;
  // 设备状态
  enum DeviceStatusType {
    // 设备正常
    DEVICE_STATUS_NORMAL = 0;
  }
  DeviceStatusType deviceStatus = 13;
  // 设备型号
  string model = 14;
  // 消息回调监控
  bool cbCheck = 15;
}

message SetDeviceRequest {
  // 咕咕鸡设备GUID
  string smartGuid = 1;
  // LED
  bool led = 2;
  // 蜂鸣器
  bool buz = 3;
  // 打印浓度
  enum SpeedType {
    // 适中
    SPEED_DEFAULT = 0;
    // 浅
    SPEED_LIGHT = 1;
    // 深
    SPEED_DARK = 2;
  }
  SpeedType speed = 4;
}

message SendMsgRequest {
  // 咕咕鸡设备GUID
  string smartGuid = 1;
  // 纸条内容
  SendMsgRequestContent content = 2;
}

message SendMsgResponse {
  // 纸条ID
  int64 paperID = 1;
}

message SendMsgRequestContent {
  // 重要纸条
  bool important = 1;
  // 纸条数据段, 11个以上可能打印不了
  repeated SendMsgRequestContentContent content = 2;
}

message SendMsgRequestContentContent {
  // 类型
  enum ContentType {
    // 文本
    CONTENT_TEXT = 0;
    // 图片
    CONTENT_IMAGE = 1;
    // 图标
    CONTENT_ICON = 2;
    // 二维码
    CONTENT_QR = 3;
  }
  ContentType type = 1;
  // 字体大小
  enum FontSizeType {
    FONTSIZE_NORMAL = 0;
    FONTSIZE_LARGE = 1;
  }
  FontSizeType fontSize = 2;
  // 加粗
  bool bold = 3;
  // 图标ID, 对应图标表
  int64 iconID = 4;
  // 文字或者图片数据, 汉字必须要GBK编码, 图片必须是单色位图, 可以通过MakeMonoBmp接口获取
  bytes baseText = 5;
  // 禁止添加换行符
  bool noWrap = 6;
}

message MakeMonoBmpRequest {
  // 原始图片数据(支持PNG、JPEG)
  bytes image = 1;
}

message MakeMonoBmpResponse {
  // 单色位图数据
  bytes bmp = 1;
}

service ApiService {
  // 获取在线设备列表
  rpc ListOnlineDevices(ListOnlineDevicesRequest) returns (ListOnlineDevicesResponse) {}
  // 获取在线设备详情
  rpc DeviceDetail(GenericRequest) returns (DeviceDetailResponse) {}
  // 踢出设备
  rpc KickDevice(GenericRequest) returns (GenericResponse) {}
  // 设置设备参数
  rpc SetDevice(SetDeviceRequest) returns (GenericResponse) {}
  // 发送纸条
  rpc SendMsg(SendMsgRequest) returns (SendMsgResponse) {}
  // 强制解锁设备消息回调进程
  rpc UnlockDeviceMessageCallback(GenericRequest) returns (GenericResponse) {}

  // 获取单色位图
  rpc MakeMonoBmp(MakeMonoBmpRequest) returns (MakeMonoBmpResponse) {}
}