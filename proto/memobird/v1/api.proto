syntax = "proto3";

package memobird.v1;

option go_package = "github.com/flyqie/memobird-priv-bt/gen/memobird/v1;v1";

message ErrDetail {
  // 错误信息
  string message = 1;
}

message GenericRequest {
  // 咕咕鸡设备GUID
  string smartGuid = 1;
}

message GenericResponse {
  // 目前空响应
}

message ListOnlineDevicesRequest {
  // 目前空请求
}

message ListOnlineDevicesResponse {
  // 当前咕咕鸡设备GUID列表
  repeated string onlineDevices = 1;
}

message DeviceDetailResponse {
  // 咕咕鸡设备GUID
  string smartGuid = 1;
  // MAC地址
  string bssid = 2;
  // LED
  bool led = 3;
  // 打印浓度
  enum DeepType {
    // 适中
    DEEP_DEFAULT = 0;
    // 浅
    DEEP_LIGHT = 1;
    // 深
    DEEP_DARK = 2;
  }
  DeepType deep = 4;
  // 固件版本
  string ver = 5;
  // 电量
  int32 elec = 6;
  // 设备状态
  enum DeviceStatusType {
    // 设备正常
    DEVICE_STATUS_NORMAL = 0;
    // 设备连接中
    DEVICE_STATUS_CONNECTING = 1;
  }
  DeviceStatusType deviceStatus = 7;
  // 自动关机
  enum AutoShutdownType {
    // 10分钟
    AUTO_SHUTDOWN_TIME_10 = 0;
    // 30分钟
    AUTO_SHUTDOWN_TIME_30 = 1;
    // 1小时
    AUTO_SHUTDOWN_TIME_60 = 2;
    // 2小时
    AUTO_SHUTDOWN_TIME_120 = 3;
    // 3小时
    AUTO_SHUTDOWN_TIME_180 = 4;
    // 4小时
    AUTO_SHUTDOWN_TIME_240 = 5;
  }
  AutoShutdownType autoShutdown = 8;
  // 设备加入时间
  int64 joinTime = 9;
  // 已发送消息数量
  uint64 msgCount = 10;
  // 队列消息数量
  uint64 msgQueueCount = 11;
  // 设备型号
  string model = 12;
  // 消息回调监控
  bool cbCheck = 13;
}

message SetDeviceRequest {
  // 咕咕鸡设备GUID
  string smartGuid = 1;
  // 打印浓度
  enum DeepType {
    // 适中
    DEEP_DEFAULT = 0;
    // 浅
    DEEP_LIGHT = 1;
    // 深
    DEEP_DARK = 2;
  }
  // 自动关机
  enum AutoShutdownType {
    // 10分钟
    AUTO_SHUTDOWN_TIME_10 = 0;
    // 30分钟
    AUTO_SHUTDOWN_TIME_30 = 1;
    // 1小时
    AUTO_SHUTDOWN_TIME_60 = 2;
    // 2小时
    AUTO_SHUTDOWN_TIME_120 = 3;
    // 3小时
    AUTO_SHUTDOWN_TIME_180 = 4;
    // 4小时
    AUTO_SHUTDOWN_TIME_240 = 5;
  }
  oneof setting {
    // LED
    bool led = 2;
    // 打印浓度
    DeepType deep = 4;
    // 自动关机
    AutoShutdownType autoShutdown = 8;
  }
}

message SendMsgRequest {
  // 咕咕鸡设备GUID
  string smartGuid = 1;
  // 纸条内容
  SendMsgRequestContent content = 2;
}

message ConnectDeviceRequest {
  // 咕咕鸡设备GUID
  string smartGuid = 1;
}

message SendMsgResponse {
  // 纸条ID
  int64 paperID = 1;
}

message SendMsgRequestContent {
  // 纸条数据段, 11个以上可能打印不了
  repeated SendMsgRequestContentContent content = 2;
}

message SendMsgRequestContentContent {
  // 类型
  enum ContentType {
    // 文本
    CONTENT_TEXT = 0;
    // 图片
    CONTENT_IMAGE = 1;
    // 图标
    CONTENT_ICON = 2;
    // 二维码
    CONTENT_QR = 3;
  }
  ContentType type = 1;
  // 下划线
  bool underline = 2;
  // 加粗
  bool bold = 3;
  // 图标ID, 对应图标表
  int64 iconID = 4;
  // 文字或者图片数据, 汉字必须要GBK编码, 图片必须是单色位图, 可以通过MakeMonoBmp接口获取
  bytes baseText = 5;
  // 禁止添加换行符
  bool noWrap = 6;
}

message MakeMonoBmpRequest {
  // 原始图片数据(支持PNG、JPEG)
  bytes image = 1;
}

message MakeMonoBmpResponse {
  // 单色位图数据
  bytes bmp = 1;
}

service ApiService {
  // 获取在线设备列表
  rpc ListOnlineDevices(ListOnlineDevicesRequest) returns (ListOnlineDevicesResponse) {}
  // 获取在线设备详情
  rpc DeviceDetail(GenericRequest) returns (DeviceDetailResponse) {}
  // 连接设备
  rpc ConnectDevice(ConnectDeviceRequest) returns (GenericResponse) {}
  // 踢出设备
  rpc KickDevice(GenericRequest) returns (GenericResponse) {}
  // 设置设备参数
  rpc SetDevice(SetDeviceRequest) returns (GenericResponse) {}
  // 发送纸条
  rpc SendMsg(SendMsgRequest) returns (SendMsgResponse) {}
  // 强制解锁设备消息回调进程
  rpc UnlockDeviceMessageCallback(GenericRequest) returns (GenericResponse) {}

  // 获取单色位图
  rpc MakeMonoBmp(MakeMonoBmpRequest) returns (MakeMonoBmpResponse) {}
}